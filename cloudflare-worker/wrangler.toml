name = "gallery-media-worker"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# R2 Bucket Binding (Substitua pelos nomes reais da sua conta Cloudflare)
[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "lumina-photos-originals"

[vars]
ENVIRONMENT = "production"
DEFAULT_WATERMARK_URL = "https://yourdomain.com/watermark-default.png"
